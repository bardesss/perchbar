name: Release

# Push a tag like v0.1.0 to build the installer and the portable exe and
# attach them to a draft GitHub Release. Nothing is public until the draft is
# published by hand. Run it manually (Actions tab) to build without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Rust build embeds ui/dist; `cargo tauri build` rebuilds it too.
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Read version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $conf = (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($conf -ne $cargo) { throw "tauri.conf.json says $conf but Cargo.toml says $cargo" }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$conf") {
            throw "Tag $env:REF_NAME does not match version $conf"
          }
          "version=$conf" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: app
        run: cargo tauri build

      - name: Collect files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was built" }
          Copy-Item $setup.FullName "dist/Perchbar-$v-setup.exe"
          Copy-Item target/release/perchbar.exe "dist/Perchbar-$v-portable.exe"
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perchbar-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $ghArgs = @("release", "create", $env:TAG) + (Get-ChildItem dist/*).FullName +
            @("--draft", "--title", "Perchbar $env:VERSION", "--generate-notes")
          if ($env:VERSION.StartsWith("0.")) { $ghArgs += "--prerelease" }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
