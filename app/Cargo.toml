[package]
name = "perchbar"
version = "0.1.0"
edition = "2021"
description = "Windows 11 taskbar widgets"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
chrono-tz = "0.10"
chrono = "0.4"
log = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
