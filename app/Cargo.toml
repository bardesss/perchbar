[package]
name = "perchbar"
version = "0.1.0"
edition = "2021"
description = "Windows 11 taskbar widgets"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
